name: CI Laravel

on:
  push:
    branches: [main, 'fallo/**', 'mejora/**']
  pull_request:
    branches: [main]

# MEJORA: cancela ejecuciones duplicadas
# concurrency:
#   group: ci-${{ github.ref }}
#   cancel-in-progress: true

env:
  PHP_VERSION: '8.3'

jobs:
  estatico:
    name: Analisis estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # MEJORA: cache de Composer
      # - uses: actions/cache@v4
      #   with:
      #     path: ~/.composer/cache
      #     key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Estilo (Pint)
        run: ./vendor/bin/pint --test

      - name: Analisis estatico (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  pruebas:
    name: Pruebas unitarias, integracion, aceptacion y regresion
    needs: estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov

      # MEJORA: cache de Composer
      # - uses: actions/cache@v4
      #   with:
      #     path: ~/.composer/cache
      #     key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p reports

      - name: Pruebas unitarias
        run: php artisan test --testsuite=Unit --log-junit=reports/unit.xml

      - name: Pruebas de integracion, aceptacion y regresion
        run: php artisan test --testsuite=Feature --log-junit=reports/feature.xml

      # MEJORA: umbral de cobertura
      # - name: Cobertura minima 70%
      #   run: php artisan test --coverage --min=70

      - name: Resumen de metricas
        if: always()
        run: php scripts/junit-summary.php reports/unit.xml reports/feature.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: reports/

  rendimiento:
    name: Rendimiento (localhost controlado)
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Preparar app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Instalar ApacheBench
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Levantar servidor temporal
        run: |
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &
          sleep 5
          curl -fsS http://127.0.0.1:8000/api/health

      - name: Prueba de rendimiento
        run: ./scripts/perf-test.sh http://127.0.0.1:8000/api/health 200 10 300